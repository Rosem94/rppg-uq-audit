BASE: ['']
TOOLBOX_MODE: "only_test"
TEST:
  METRICS: ['MAE', 'RMSE', 'MAPE', 'Pearson', 'SNR', 'BA']
  USE_LAST_EPOCH: True
  DATA:
    INFO:
      LIGHT: [1, 2, 3, 4]       # LED-Low, LED-high, Incandescent, Nature
      MOTION: [1, 2, 3, 4]      # Stationary, Rotation, Talking, Walking
      EXERCISE: [1, 2]          # True, False
      SKIN_COLOR: [3, 4, 5, 6]  # Fitzpatrick types 3-6
      GENDER: [1, 2]
      GLASSER: [1, 2]
      HAIR_COVER: [1, 2]
      MAKEUP: [1, 2]
    FS: 30
    DATASET: MMPD
    DO_PREPROCESS: False
    DATA_FORMAT: NCDHW
    DATA_PATH:   "./data/MMPD"
    CACHED_PATH: "./data/MMPD_preprocessed"
    EXP_DATA_NAME: ""
    BEGIN: 0.0
    END: 1.0
    PREPROCESS:
      DATA_TYPE: ['DiffNormalized']
      LABEL_TYPE: DiffNormalized
      DO_CHUNK: True
      CHUNK_LENGTH: 160       # MUST match UBFC training (PhysNet frames=160)
      CROP_FACE:
        DO_CROP_FACE: True    # MMPD raw video is 240x320, need face crop
        BACKEND: 'HC'
        USE_LARGE_FACE_BOX: True
        LARGE_BOX_COEF: 1.5
        DETECTION:
          DO_DYNAMIC_DETECTION: False
          DYNAMIC_DETECTION_FREQUENCY: 30
          USE_MEDIAN_FACE_BOX: False
      RESIZE:
        H: 72
        W: 72
DEVICE: cuda:0
NUM_OF_GPU_TRAIN: 1
LOG:
  PATH: runs/exp
MODEL:
  DROP_RATE: 0.2
  NAME: PhysnetMCDropout
  PHYSNET:
    FRAME_NUM: 160
    DROPOUT_RATE: 0.1
INFERENCE:
  BATCH_SIZE: 4
  EVALUATION_METHOD: FFT
  EVALUATION_WINDOW:
    USE_SMALLER_WINDOW: False
    WINDOW_SIZE: 10
  MODEL_PATH: ""